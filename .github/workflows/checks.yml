          except Exception:
              traceback.print_exc()
          '

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # RustSec's database of vulnerable, unsound and unmaintained crates, checked against the
      # locked versions; unmaintained crates only warn.
      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit
