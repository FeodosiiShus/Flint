  lint:
    name: Dylint on title_bar
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          # rust-cache keys on every installed toolchain, so the runner image's own stable
          # would turn each image update into a cache miss.
          rustup toolchain uninstall stable || true
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      # Restored before the install, so `cargo install` finds the cached dylint binaries.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dylint tools and pinned nightly
        run: |
          cargo install --locked cargo-dylint dylint-link
          toolchain="$(awk -F'"' '/^channel/ {print $2}' tooling/lints/rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component rustc-dev,rust-src,llvm-tools-preview --profile minimal

      # Deny the custom lints proven green on title_bar. entity_update_in_render
      # is excluded: TitleBar::render intentionally syncs the platform
      # titlebar (set_button_layout/set_children) during render, so that lint
      # fires there by design. Widen the scope only from a green baseline.
      - name: Run custom dylint suite on title_bar
        run: |
          set -o pipefail
          DYLINT_RUSTFLAGS="-D shared_string_from_str_literal -D async_block_without_await -D blocking_io_on_foreground -D map_lookup_then_insert -D notify_in_render -D owned_string_into_shared" \
            cargo dylint --all -- --locked -p title_bar 2>&1 | tee "${RUNNER_TEMP}/dylint.log"

      - name: Run custom lint UI tests
        if: always()
        working-directory: tooling/lints
        run: |
          set -o pipefail
          cargo test 2>&1 | tee -a "${RUNNER_TEMP}/dylint.log"

      - name: Failure summary
        if: always()
        env:
          SUMMARY_TITLE: Dylint on title_bar
          SUMMARY_LOG_NAME: dylint.log
        run: |
          python3 -c '
          import glob
          import os
          import re
          import traceback
          import xml.etree.ElementTree as ET


          def collect_junit():
              found = []
              patterns = ["target/nextest/**/*.xml"]
              runner_temp = os.environ.get("RUNNER_TEMP", "")
              if runner_temp:
                  patterns.append(os.path.join(runner_temp, "*.xml"))
              for pattern in patterns:
                  found.extend(glob.glob(pattern, recursive=True))
              return sorted(set(found))


          def main():
              title = os.environ.get("SUMMARY_TITLE", "tests")
              print(f"=== Failure summary ({title}) ===")
              failures = []
              source = "test step log"
              junit_files = collect_junit()
              if junit_files:
                  source = ", ".join(junit_files)
                  for path in junit_files:
                      try:
                          root = ET.parse(path).getroot()
                      except Exception as exc:
                          print(f"{path}: could not parse JUnit XML ({exc})")
                          continue
                      for case in root.iter("testcase"):
                          problems = list(case.iter("failure")) + list(case.iter("error"))
                          for problem in problems:
                              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                              detail = ((problem.get("message") or "") + "\n" + (problem.text or "")).strip()
                              failures.append((name or "(unnamed test)", detail or "(no detail)"))
              else:
                  log_name = os.environ.get("SUMMARY_LOG_NAME", "")
                  runner_temp = os.environ.get("RUNNER_TEMP", "")
                  log_path = os.path.join(runner_temp, log_name) if runner_temp and log_name else log_name
