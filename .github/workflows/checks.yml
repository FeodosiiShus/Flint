name: Checks

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: Format, check and tests
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check app crates compile
        run: cargo check --locked --package zed --package cli

      - name: Run tests for crates changed by Flint
        run: cargo test --locked --package settings --package release_channel --package cli --package theme_settings

      - name: Run background image tests
        run: cargo test --locked --package ui --package workspace --lib background_image

      - name: Run chrome size tests
        run: cargo test --locked --package ui --lib chrome_size

      - name: Run title bar tests
        run: cargo test --locked --package title_bar

      - name: Run status bar widget tests
        run: cargo test --locked --package status_widgets

      - name: Run Search Everywhere tests
        run: cargo test --locked --package search_everywhere --package file_finder --package project_symbols --package command_palette

      - name: Run three-way merge tests
        run: cargo test --locked --package three_way_merge

      - name: Run git conflict stage tests
        run: cargo test --locked --package git --package fs --features fs/test-support

      - name: Run project git store integration tests
        run: cargo test --locked --package project --features project/test-support --test integration git_store

      - name: Run merge tool and git panel tests
        run: cargo test --locked --package git_ui --lib -- merge_tool git_panel

      - name: Run Git Branches popup tests
        run: cargo test --locked --package git_ui --lib -- branches_popup branch_operations branch_refs

      - name: Run keybinding glyph tests
        run: cargo test --locked --package ui --lib keybinding

      - name: Run gpui tests
        run: cargo test --locked --package gpui

      - name: Run islands, tool window bar, tool window header and tab tests
        run: cargo test --locked --package workspace --package ui --lib -- tool_window_bar tool_window_header island inactive_window status_bar_hides_panel_buttons workspace_settings tab::tests hidden_tabs test_new_tab_scrolls_into_view_completely test_pinned_tabs_scroll_to_item_uses_correct_index project_gradient

      - name: Run islands chrome pixel tests
        run: cargo test --locked --package ui --test islands_chrome_pixels

      - name: Run icon asset tests
        run: cargo test --locked --package icons

      - name: Run project panel rounded selection tests
        run: cargo test --locked --package project_panel --lib rounded_selection

      - name: Run project panel select opened file tests
        run: cargo test --locked --package project_panel --lib select_opened_file

      - name: Run editor rounded scrollbar thumb tests
        run: cargo test --locked --package editor --lib rounded_thumb

      - name: Run language server DOTNET_ROOT tests
        run: cargo test --locked --package project --features project/test-support --lib dotnet_root

      - name: Run TypeScript native language server tests
        run: cargo test --locked --package languages --lib tsgo

      - name: Run language server activation tests
        run: cargo test --locked --package project --features project/test-support --lib server_activation

      - name: Run zed action and keymap tests
        run: cargo test --locked --package zed --bin zed -- test_action_namespaces test_base_keymap

      - name: Check tests of crates changed by Flint compile
        run: cargo check --locked --tests --package editor --package workspace --package client --package settings_ui --package terminal_view --package outline_panel --package language_tools --package diagnostics --package extension_host
