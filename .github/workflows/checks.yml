name: Checks

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test-core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check app crates compile
        run: cargo check --locked --package zed --package cli

      - name: Run core tests
        run: |
          cargo nextest run --locked --profile ci --tests \
            --package settings --package release_channel --package cli --package theme_settings \
            --package ui --package workspace --package title_bar --package gpui_macos \
            --package search_everywhere --package file_finder --package project_symbols --package command_palette --package picker \
            --package search --package merge_diff --package diagnostics --package language_tools \
            --package git --package fs --package project --package git_ui --package icons --package project_panel \
            --package editor --package markdown --package markdown_preview \
            --package languages --package language --package language_core --package grammars --package extensions_ui \
            --package migrator --package util --package settings_ui --package show_usages \
            --features fs/test-support,project/test-support \
            -E 'package(=settings) | package(=release_channel) | package(=cli) | package(=theme_settings)' \
            -E '(package(=ui) | package(=workspace)) & kind(lib) & test(~background_image)' \
            -E 'package(=ui) & kind(lib) & (test(~chrome_size) | test(~keybinding) | test(~icon_column))' \
            -E 'binary_id(=ui::islands_chrome_pixels) | binary_id(=ui::popup_pixels)' \
            -E 'package(=title_bar)' \
            -E 'package(=gpui_macos) & kind(lib) & test(~fullscreen_titlebar)' \
            -E 'package(=search_everywhere) | package(=file_finder) | package(=project_symbols) | package(=command_palette) | package(=picker)' \
            -E 'package(=search) & kind(lib) & (test(~test_new_project_search_in_directory) | test(~test_deploy_search_with_multiple_panes) | test(~test_search_dismisses_modal))' \
            -E 'package(=merge_diff)' \
            -E '(package(=diagnostics) | package(=language_tools)) & kind(lib) & (test(~project_diagnostics_panel) | test(~language_services_panel))' \
            -E 'package(=git) | package(=fs)' \
            -E 'binary_id(=project::integration) & test(~git_store)' \
            -E 'package(=project) & kind(lib) & (test(~dotnet_root) | test(~server_activation))' \
            -E 'package(=git_ui) & kind(lib) & (test(~merge_tool) | test(~git_panel) | test(~branches_popup) | test(~branch_operations) | test(~branch_refs) | test(~git_log) | test(~git_tool_window))' \
            -E '(package(=workspace) | package(=ui)) & kind(lib) & (test(~tool_window_bar) | test(~tool_window_header) | test(~island) | test(~inactive_window) | test(~workspace_settings) | test(~tab::tests) | test(~hidden_tabs) | test(~test_new_tab_scrolls_into_view_completely) | test(~test_pinned_tabs_scroll_to_item_uses_correct_index) | test(~project_gradient) | test(~test_swap_item_))' \
            -E 'package(=workspace) & kind(lib) & (test(~tab_context_menu) | test(~tab_bar_more_menu) | test(~bottom_toolbar) | test(~panel_size_state) | test(~test_restoring_pinned_tabs) | test(~modal_anchor) | test(~background_task))' \
            -E 'package(=icons)' \
            -E 'package(=project_panel) & kind(lib) & (test(~rounded_selection) | test(~select_opened_file) | test(~undo_rename_keeps_created_dir_holding_excluded_files))' \
            -E 'package(=editor) & kind(lib) & (test(~rounded_thumb) | test(~mouse_context_menu) | test(~intellij_gutter) | test(~inspection_widget) | test(~breadcrumb) | test(~test_matching_bracket_highlights) | test(~inlay_hint_pill) | test(~text_editor_with_preview) | test(~sticky_header_whitespace) | test(~show_usages) | test(~code_vision) | test(~auto_collapse_imports))' \
            -E 'package(=markdown) & kind(lib) & test(~top_aligned_autoscroll)' \
            -E 'package(=markdown_preview)' \
            -E 'package(=languages) & kind(lib) & (test(~tsgo) | test(~server_activation))' \
            -E 'package(=language) & kind(lib) & (test(~test_resolve_language_servers) | test(~test_language_servers_across_settings_files) | test(~test_language_servers_combined_restrictions) | test(~fold_regions))' \
            -E 'package(=language_core)' \
            -E 'package(=extensions_ui) & kind(lib) & test(~marker_install)' \
            -E 'package(=migrator) & kind(lib) & test(~test_rename_restore_on_startup_values_at_root_and_in_overrides)' \
            -E 'package(=util) & kind(lib) & test(~path_with_position_parse_keeps_directories_containing_the_file_name)' \
            -E 'package(=settings_ui) & kind(lib) & (test(~test_trust_all_projects_json_path_names_the_written_key) | test(~test_reset_is_hidden_when_only_the_fallback_setting_is_set))' \
            -E 'package(=show_usages)'

  test-ui-heavy:
    name: GPUI and app tests
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run gpui tests
        run: cargo test --locked --package gpui

      - name: Run zed action, keymap and project window tests
        run: cargo test --locked --package zed --bin flint -- test_action_namespaces test_base_keymap test_open_paths test_bundled_languages test_project_window_

      - name: Check tests of crates changed by Flint compile
        run: cargo check --locked --tests --package editor --package workspace --package client --package settings_ui --package settings_content --package terminal_view --package language_tools --package diagnostics --package extension_host --package markdown --package markdown_preview
