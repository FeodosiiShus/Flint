name: Checks

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test-core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          # rust-cache keys on every installed toolchain, so the runner image's own stable
          # would turn each image update into a cache miss.
          rustup toolchain uninstall stable || true
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check app crates compile
        run: cargo check --locked --package zed --package cli

      - name: Run core tests
        run: |
          set -o pipefail
          # Every workspace crate, so a crate whose tests nobody listed cannot regress unnoticed.
          # zed and gpui run in the GPUI and app tests job.
          cargo nextest run --locked --profile ci --tests --no-fail-fast \
            --workspace --exclude zed --exclude gpui \
            --features fs/test-support,project/test-support \
            2>&1 | tee "${RUNNER_TEMP}/nextest-core.log"

      - name: Failure summary
        if: always()
        env:
          SUMMARY_TITLE: Core tests
          SUMMARY_LOG_NAME: nextest-core.log
        run: |
          python3 -c '
          import glob
          import os
          import re
          import traceback
          import xml.etree.ElementTree as ET


          def collect_junit():
              found = []
              patterns = ["target/nextest/**/*.xml"]
              runner_temp = os.environ.get("RUNNER_TEMP", "")
              if runner_temp:
                  patterns.append(os.path.join(runner_temp, "*.xml"))
              for pattern in patterns:
                  found.extend(glob.glob(pattern, recursive=True))
              return sorted(set(found))


          def main():
              title = os.environ.get("SUMMARY_TITLE", "tests")
              print(f"=== Failure summary ({title}) ===")
              failures = []
              source = "test step log"
              junit_files = collect_junit()
              if junit_files:
                  source = ", ".join(junit_files)
                  for path in junit_files:
                      try:
                          root = ET.parse(path).getroot()
                      except Exception as exc:
                          print(f"{path}: could not parse JUnit XML ({exc})")
                          continue
                      for case in root.iter("testcase"):
                          problems = list(case.iter("failure")) + list(case.iter("error"))
                          for problem in problems:
                              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                              detail = ((problem.get("message") or "") + "\n" + (problem.text or "")).strip()
                              failures.append((name or "(unnamed test)", detail or "(no detail)"))
              else:
                  log_name = os.environ.get("SUMMARY_LOG_NAME", "")
                  runner_temp = os.environ.get("RUNNER_TEMP", "")
                  log_path = os.path.join(runner_temp, log_name) if runner_temp and log_name else log_name
                  if log_path:
                      source = log_path
                  try:
                      with open(log_path, encoding="utf-8", errors="replace") as handle:
                          lines = handle.read().splitlines()
                  except OSError as exc:
                      print(f"No test output found at {log_path} ({exc}); see the test step log above.")
                      lines = []
                  fail_re = re.compile(r"\bFAIL\b|\bFAILED\b|^\s*error(\[|:)")
                  in_failures = False
                  for line in lines:
                      if re.match(r"^\s*failures:\s*$", line):
                          in_failures = True
                          continue
                      if in_failures:
                          if not line.strip() or not line[:1].isspace():
                              in_failures = False
                          else:
                              failures.append((line.strip(), line.strip()))
                              continue
                      if fail_re.search(line):
                          failures.append((line.strip(), line.strip()))
                  for line in [line for line in lines if re.search(r"\d+\s+(passed|failed|errored)", line)][-5:]:
                      print(line)
                  if lines and not failures and not any(fail_re.search(line) or "failed" in line for line in lines):
                      print("No failures detected in test output.")
              seen = set()
              unique = []
              for name, detail in failures:
                  if name not in seen:
                      seen.add(name)
                      unique.append((name, detail))
              for name, detail in unique[:200]:
                  print(f"--- {name}")
                  print(f"    source: {source}")
                  for detail_line in detail.splitlines()[:20]:
                      print(f"    {detail_line}")
              if len(unique) > 200:
                  print(f"... and {len(unique) - 200} more failing tests; see the test step log.")
              print(f"Total failing tests reported: {len(unique)}")


          try:
              main()
          except Exception:
              traceback.print_exc()
          '

