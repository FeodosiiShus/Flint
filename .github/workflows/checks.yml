name: Checks

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    name: Format, check and tests
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          probe_metal() {
            printf 'kernel void probe(device float *out [[buffer(0)]]) { out[0] = 1.0; }\n' > "${RUNNER_TEMP}/probe.metal"
            xcrun -sdk macosx metal -c "${RUNNER_TEMP}/probe.metal" -o "${RUNNER_TEMP}/probe.air" &&
              xcrun -sdk macosx metallib "${RUNNER_TEMP}/probe.air" -o "${RUNNER_TEMP}/probe.metallib"
          }
          if ! probe_metal; then
            xcodebuild -downloadComponent metalToolchain
            probe_metal
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check app crates compile
        run: cargo check --locked --package zed --package cli

      - name: Run tests for crates changed by Flint
        run: cargo test --locked --package settings --package release_channel --package cli --package theme_settings

      - name: Run background image tests
        run: cargo test --locked --package ui --package workspace --lib background_image

      - name: Run chrome size tests
        run: cargo test --locked --package ui --lib chrome_size

      - name: Run title bar tests
        run: cargo test --locked --package title_bar

      - name: Run status bar widget tests
        run: cargo test --locked --package status_widgets

      - name: Run Search Everywhere tests
        run: cargo test --locked --package search_everywhere --package file_finder --package project_symbols --package command_palette

      - name: Run three-way merge tests
        run: cargo test --locked --package three_way_merge

      - name: Run git conflict stage tests
        run: cargo test --locked --package git --package fs --features fs/test-support

      - name: Run project git store integration tests
        run: cargo test --locked --package project --features project/test-support --test integration git_store

      - name: Run merge tool and git panel tests
        run: cargo test --locked --package git_ui --lib -- merge_tool git_panel

      - name: Run gpui tests
        run: cargo test --locked --package gpui --package gpui_wgpu

      - name: Run islands, tool window bar, tab and sound tests
        run: cargo test --locked --package workspace --package ui --package audio --lib -- tool_window_bar island status_bar_hides_panel_buttons workspace_settings tab::tests sound

      - name: Run zed action and keymap tests
        run: cargo test --locked --package zed --bin zed -- test_action_namespaces test_base_keymap

      - name: Check tests of crates changed by Flint compile
        run: cargo check --locked --tests --package editor --package vim --package workspace --package agent --package agent_ui --package language_models --package client --package remote_server --package settings_ui --package terminal_view --package sidebar --package debugger_ui --package outline_panel --package language_tools --package diagnostics --package extension_host
